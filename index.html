<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YUGOLEARN — Learn Serbian & Cyrillic, the raw way</title>
  <meta name="description" content="A brutalist, no-fluff web app to learn the Serbian Cyrillic alphabet and language: adaptive letter drills, spaced-repetition flashcards, listening and typing quizzes, phrases with audio, and grammar.">
  <meta name="theme-color" content="#f3efe6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' fill='%23e5361f' stroke='%230e0e0e' stroke-width='6'/%3E%3Ctext x='32' y='46' font-size='38' font-family='Arial Black' font-weight='900' text-anchor='middle' fill='%23fff'%3E%D0%96%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem("yugolearn_state_v1");
        var theme = "dark";
        var font = "learner";
        if (saved) {
          var parsed = JSON.parse(saved);
          if (parsed.settings) {
            if (parsed.settings.theme) theme = parsed.settings.theme;
            if (parsed.settings.fontFamily) font = parsed.settings.fontFamily;
          }
        }
        var effective = theme;
        if (theme === "auto") {
          effective = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", effective);
        document.documentElement.setAttribute("data-theme-pref", theme);
        document.documentElement.setAttribute("data-font", font);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:14px;">
      <a href="#/" class="logo" id="logo" aria-label="Yugolearn home">
        <span class="logo-box">Ж</span><span>YUGO<span class="logo-2">LEARN</span></span>
      </a>
      <span class="yugo-stamp" title="Savezni zavod za jezik · SFRJ 1974">СФРЈ · СЛУЖБЕНО № 74</span>
    </div>
    <div class="hud">
      <button class="hud-item hud-theme" id="btn-theme-toggle" title="Пребаци тему / Toggle Dark Mode (T)" aria-label="Toggle dark mode">🌙 NOĆ</button>
      <button class="hud-item hud-font" id="btn-font-cycle" title="Пребаци фонт / Cycle Font Preset (F)" aria-label="Cycle font preset">🔤 FONT</button>
      <span class="hud-item hud-backend" id="hud-backend" title="Local Intelligence & SQLite Status">⚡ LOCAL AI</span>
      <span class="hud-item hud-streak" id="hud-streak" title="Daily streak">STREAK 0</span>
      <span class="hud-item hud-xp" id="hud-xp" title="Total XP">0 XP</span>
      <a href="#/settings" class="hud-item hud-set" id="nav-settings" title="Settings" aria-label="Settings">⚙</a>
    </div>
  </header>

  <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

  <nav class="nav" id="nav" aria-label="Main">
    <a href="#/" id="nav-home">Home</a>
    <a href="#/alphabet" id="nav-alphabet">Азбука</a>
    <a href="#/drill" id="nav-drill">Drill</a>
    <a href="#/cards" id="nav-cards">Cards</a>
    <a href="#/srs" id="nav-srs">Smart SRS</a>
    <a href="#/tutor" id="nav-tutor">AI Tutor</a>
    <a href="#/mistakes" id="nav-mistakes">Mistakes</a>
    <a href="#/vocab" id="nav-vocab">Vocab Bank</a>
    <a href="#/quiz" id="nav-quiz">Quiz</a>
    <a href="#/match" id="nav-match">Match</a>
    <a href="#/logistics" id="nav-logistics">Logistics</a>
    <a href="#/phrases" id="nav-phrases">Phrases</a>
    <a href="#/grammar" id="nav-grammar">Grammar</a>
    <a href="#/convert" id="nav-convert">Convert</a>
  </nav>

  <main id="view" class="view"></main>

  <footer class="footer">
    <span><b>YUGOLEARN</b> — учи српски / uči srpski</span>
    <span>Persistent Memory: SQLite WAL · AI: <a href="#/settings" id="audio-badge">…</a></span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/local-engine.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
